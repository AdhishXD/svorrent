# ==============================================================================
# Svorrent Automated Tag-to-Release Workflow
#
# Automatically triggers when a new version tag (e.g., v1.0.3) is pushed.
# Builds the production distribution packages, computes cryptographic checksums,
# and publishes the release assets directly to GitHub Releases.
# ==============================================================================

name: Automated Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 3. Install Frontend Dependencies & Build React Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 4. Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: 5. Build macOS DMG Package
        run: |
          ./scripts/build-dmg.sh
          ls -lh dist-app/Svorrent.dmg

      - name: 6. Generate Cryptographic SHA-256 Checksums
        run: |
          cd dist-app
          shasum -a 256 Svorrent.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 7. Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets..."
            gh release upload "$TAG_NAME" \
              dist-app/Svorrent.dmg \
              dist-app/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist-app/Svorrent.dmg \
              dist-app/SHA256SUMS.txt \
              --title "$TAG_NAME" \
              --generate-notes
          fi
