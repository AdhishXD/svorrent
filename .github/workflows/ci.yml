# ==============================================================================
# Svorrent Multi-Platform Continuous Integration (CI) Workflow
# 
# Automatically tests Svorrent on every commit across:
#   - macOS (Apple Silicon & Intel)
#   - Windows (windows-latest)
#   - Linux (ubuntu-latest)
#
# Runs:
#   1. Static Oxlint code quality verification
#   2. React production bundle compilation
#   3. Security & logic unit tests
#   4. Hermetic loopback BitTorrent download & SHA-256 integrity test
#   5. Headless Chromium Browser E2E UI test (verifying tabs, routing, zero errors)
#   6. Native macOS Cocoa launcher compilation
# ==============================================================================

name: CI Multi-Platform Deterministic Suite

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-suite:
    name: Core Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Install Frontend Dependencies (Hermetic)
        working-directory: frontend
        run: npm ci

      - name: 4. Static Lint Check (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: 5. Build React Web Application (Vite)
        working-directory: frontend
        run: npm run build

      - name: 6. Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: 7. Install Backend Dependencies (Hermetic)
        working-directory: backend
        run: npm ci

      - name: 8. Run Backend Security & Logic Unit Tests
        working-directory: backend
        run: npm test

      - name: 9. Run Local Hermetic BitTorrent Transfer Test
        working-directory: backend
        run: npm run test:e2e

      - name: 10. Cold-start Windows desktop launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual C++ build tools are missing' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $command = 'call "' + $vcvars + '" >nul && cl /nologo /O2 scripts\launcher.c /Fe:Svorrent.exe /link /SUBSYSTEM:WINDOWS ws2_32.lib shell32.lib user32.lib'
          cmd /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Windows launcher compilation failed' }

          $env:SVORRENT_DISABLE_PUBLIC_DISCOVERY = '1'
          $env:SVORRENT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'svorrent-data'
          $env:SVORRENT_DOWNLOAD_DIR = Join-Path $env:RUNNER_TEMP 'svorrent-downloads'
          $launcher = Start-Process -FilePath (Join-Path $PWD 'Svorrent.exe') -WorkingDirectory $PWD -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(100)
          $ready = $false
          try {
            do {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:3001/api/health' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              if ($launcher.HasExited -and $launcher.ExitCode -ne 0) {
                throw "Launcher exited early with code $($launcher.ExitCode)"
              }
              Start-Sleep -Milliseconds 500
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $ready) { throw 'Backend did not become ready within 100 seconds' }
            if (-not $launcher.WaitForExit(10000) -or $launcher.ExitCode -ne 0) {
              throw 'Launcher did not exit successfully after the backend became ready'
            }
            $server = Get-NetTCPConnection -LocalPort 3001 -State Listen | Select-Object -First 1
            $second = Start-Process -FilePath (Join-Path $PWD 'Svorrent.exe') -WorkingDirectory $PWD -PassThru
            if (-not $second.WaitForExit(10000) -or $second.ExitCode -ne 0) {
              throw 'Second launch did not reuse the running backend'
            }
            $after = Get-NetTCPConnection -LocalPort 3001 -State Listen | Select-Object -First 1
            if ($after.OwningProcess -ne $server.OwningProcess) {
              throw 'Second launch replaced the running backend'
            }
          } finally {
            $server = Get-NetTCPConnection -LocalPort 3001 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($server) { Stop-Process -Id $server.OwningProcess -Force }
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }
          }

  browser-ui-e2e:
    name: Browser E2E UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: core-suite
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: 4. Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 5. Build React Production Distribution
        working-directory: frontend
        run: npm run build

      - name: 6. Install Playwright Chromium Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 7. Run Browser End-to-End Navigation & Runtime Error Test
        working-directory: frontend
        run: npm run test:e2e

  macos-native:
    name: Build Native macOS Cocoa Launcher
    runs-on: macos-latest
    needs: core-suite
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Compile Cocoa Dock Launcher
        run: |
          clang -O2 -fobjc-arc -framework Cocoa scripts/launcher_mac.m -o scripts/Svorrent
          file scripts/Svorrent
          codesign --verify scripts/Svorrent || true
